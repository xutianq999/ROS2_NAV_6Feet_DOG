# 局部代价地图（3D：voxel_layer 直接吃 /registered_scan 点云）
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 20.0          # 20Hz 刷新，告别残留拖影
      publish_frequency: 10.0         # 对应提高可视化发布频率
      global_frame: odom              # 保持 odom 保证局部里程计平滑
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: true
      width: 6                        # 保持 6x6 米的开阔局部窗口
      height: 6
      resolution: 0.05    # 分辨率为5cm
      # Hexplorer miniHex_v2 站立包络 863x470mm（手册规格）。
      footprint: "[ [0.43, 0.24], [0.43, -0.24], [-0.43, -0.24], [-0.43, 0.24] ]"
      plugins: ["voxel_layer", "inflation_layer"] # 3D 体素层 + 膨胀层
      footprint_clearing_enabled: true    # 开启局部地图轮廓清理
      combination_method: 1
      always_send_full_costmap: True  # 开启全图发送，确保RViz显示同步无丢包

      # STVL（spatio-temporal voxel layer，apt: ros-humble-spatio-temporal-voxel-layer）
      # 替代原生 VoxelLayer：原生层的清理完全依赖清理射线扫过格子，稀疏点云下
      # 行人残留可达分钟级；STVL 额外让"未被继续观测"的体素按 voxel_decay 秒
      # 衰减 —— 行人走开几秒就消失，墙体/家具因每帧都被重新标记而不衰减。
      # 回滚：plugin 改回 "nav2_costmap_2d::VoxelLayer"，恢复 z_resolution/z_voxels
      # 两个参数（本文件 git 历史或本注释可查）。
      voxel_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: True
        publish_voxel_map: True
        voxel_decay: 10.0           # 未被再次观测的体素 10s 衰减完（行人标记的存活期）
        decay_model: 0              # 0=线性 1=指数
        voxel_size: 0.10            # 立方体素边长（STVL 用它替代 z_resolution/z_voxels）
        origin_z: -0.6              # 体素体积下沿，理由见上方/tracking 模式说明
        mark_threshold: 0
        transform_tolerance: 0.5
        update_footprint_enabled: True
        footprint_clearing_enabled: True
        observation_sources: registered_scan
        registered_scan:
          # 桥接层转出的雷达系点云（Reliable 发布，STVL 侧订阅兼容）。
          topic: /registered_scan_livox
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: -0.6
          max_obstacle_height: 1.5
          obstacle_range: 4.0
          min_z: 0.1                 # STVL 清理模型的近/远距离（雷达坐标系）
          max_z: 4.0
          expected_update_rate: 2.0
          observation_persistence: 0.0
          inf_is_valid: False
          filter: "voxel"
          voxel_min_points: 0
          model_type: 1              # STVL 的 3D 激光模型
          horizontal_fov_angle: 6.283185
          vertical_fov_angle: 0.244346 # 保守采用 MID-360 水平面上下各 7 度
          decay_acceleration: 0.0

      # 膨胀层
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5  # 代价衰减因子：越小，高代价带越宽，路径越靠中间
        inflation_radius: 0.45   # 2026-10-25 门口卡顿调整：0.55→0.45 收窄代价带（不可通行区仍由外接半径 0.492 决定）

# 全局代价地图（static 先验图 + 3D voxel 实时层）
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0           # 全局5Hz
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      # 2026-10-25 全局图改"乐观"：footprint(内切 0.235) → robot_radius 0.18。
      # 窄门里狗的落脚点离门框标记格常 <0.235m，全局图判 lethal → 规划器拒绝
      # "Starting point in lethal space"（实测一轮卡死 21 次），恢复动作又被
      # 间隙检查全拦，整个栈按规矩拒绝一切。全局规划只需要"大致可行"，
      # 真正的碰撞安全由局部图（保持真实 0.86x0.47 足迹 + MPPI 轨迹采样）
      # 和 collision_monitor 把守。内切带 0.235→0.18 后门洞通道宽 ~11cm。
      # 回滚：删掉 robot_radius 恢复上面那行 footprint。
      # 2026-10-29 再收到原来的 2/3：0.18 → 0.12（膨胀层参数不变）。回滚改回 0.18。
      robot_radius: 0.12
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "voxel_layer", "inflation_layer"]
      footprint_clearing_enabled: true
      combination_method: 1
      always_send_full_costmap: True

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        # 注意：Nav2 的 StaticLayer 会把 lethal_cost_threshold 钳到 [0, 100]，
        # 所以写 101 实际仍按 100 处理，/map 的占据格（100）永远映射成
        # LETHAL(254)，无法通过这个参数改成 INSCRIBED(253)。而且 Smac 的
        # 栅格检查把 >=253 都当不可通行、InflationLayer 又只从 254 播种，
        # 即便得到 253 也不会带来可通行性。车陷进禁行区时由 SmartRecovery
        # 的“允许 blocked 起点、但不许代价变差”逻辑脱困，不依赖这里。
        lethal_cost_threshold: 100

      # 3D 实时障碍：STVL（理由见局部代价地图注释）。用雷达系
      # /registered_scan_livox；桥接层发这份点云前已按「base 高度 + 0.08m」
      # 滤掉地面，所以 min_obstacle_height 放得很低 —— map 系地面高度取决于
      # 锚定值（启动时被搬动过就完全不同，实测曾到 +0.33），静态阈值不可靠。
      voxel_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: True
        publish_voxel_map: True
        voxel_decay: 10.0
        decay_model: 0
        voxel_size: 0.10
        origin_z: -0.4
        mark_threshold: 0
        transform_tolerance: 0.5
        update_footprint_enabled: True
        footprint_clearing_enabled: True
        observation_sources: registered_scan
        registered_scan:
          topic: /registered_scan_livox
          data_type: "PointCloud2"
          marking: True
          clearing: True
          min_obstacle_height: -1.0
          max_obstacle_height: 1.5
          obstacle_range: 6.0
          min_z: 0.1
          max_z: 6.0
          expected_update_rate: 2.0
          observation_persistence: 0.0
          inf_is_valid: False
          filter: "voxel"
          voxel_min_points: 0
          model_type: 1
          horizontal_fov_angle: 6.283185
          vertical_fov_angle: 0.244346
          decay_acceleration: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 膨胀代价 = 252·exp(-scale·(d-footprint_radius))，超过 inflation_radius 直接截成 0。
        # 0.8m：在保持路径走中间（梯度引导 A*）和避免"起点致命空间"误判之间取平衡。
        cost_scaling_factor: 3.0
        inflation_radius: 0.8

# 静态地图服务器配置
map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: "map.yaml"         # 要加载的静态地图文件路径（后续通过Launch传入实际路径）

# 全局规划服务器
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0  # 全局规划器被期望的运行频率
    use_sim_time: False
    planner_plugins: ["GridBased"]    # 加载规划器插件
    
    GridBased:
      # 2026-10-25 从 SmacPlanner2D 换成 Hybrid（运动学感知规划），解决"门口
      # 头没对准"：2D 是质点规划器，最短路径常斜穿门洞，0.86x0.47 身板斜着过
      # 门的有效宽度是外接半径 0.49m（正对只需 0.235m），门稍窄 MPPI 就采样不出
      # 无碰撞轨迹（实测日志 25 次 "Optimizer fail to compute path"）。
      # Hybrid 带航向规划：路径以正对姿态穿门、尊重目标点 yaw（配合 Web 工作台
      # 给门口点位设朝向效果最好）。
      # 回滚：plugin 改回 "nav2_smac_planner/SmacPlanner2D" 即可（其余键多余但无害）。
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      motion_model_for_search: "REEDS_SHEPP"  # 六足可原地转也可倒退，RS 提供倒车候选
      minimum_turning_radius: 0.4   # 0.4m/s÷0.6rad/s≈0.67 满速；低速可 0.4，MPPI 会降速跟弧线
      tolerance: 0.5                # 终点容忍距离，终点在障碍物内时允许就近选点
      # 降采样省 CPU：26x63m 的 0.05m 图 × 64 航向 bin 全量搜索在 MiniPC 上太重；
      # 0.15m 网格对 0.86m 车长的路径精度足够（门洞 1m ≈ 7 格）。
      # 2026-10-25 3→2（0.15→0.10m 网格）：粗网格把门的漏斗形低代价走廊看短了，
      # 路径要到门槛才被代价场吸正 —— "到门口才转弯"。细一档后对齐线索提前出现。
      # 若规划耗时明显变长（>2s）就退回 3。
      downsample_costmap: true
      downsampling_factor: 2
      # 探索场景必须允许路径穿过未知区域，否则 frontier 目标经常会被
      # “no valid path”拒绝。
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      angle_quantization_bins: 64
      # 代价偏好：弯路和非正向行驶适度加罚，让路径倾向"对直了走"，
      # 倒车可作候选但明显吃亏（2 倍代价）。
      cost_penalty: 2.5    # 2026-10-25 2.0→2.5：更避高代价格 → 路径提前向门中心线收敛（提前转弯）
      change_penalty: 0.5
      non_straight_penalty: 1.2    # 默认 1.05；稍高于默认压病态斜切，但不强迫摆正
      reverse_penalty: 2.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      smooth_path: false            # 平滑交给 MPPI，规划侧不再做
      use_final_approach_orientation: false

# 路径平滑服务器
#
# ⚠ 注意：这套配置目前**不会被调用**。
#   默认行为树 navigate_to_pose_w_replanning_and_recovery.xml 里没有 SmoothPath
#   节点（我查过：SmoothPath 出现 0 次），所以 smoother_server 只是起来待着，
#   规划出的全局路径不会经过它。
#
#   为什么先留着而不是删掉：nav2_params.yaml 同时被安全版启动
#   (nav2_safety/safe_nav_bringup_launch.py) 和回滚用的原版启动
#   (me_nav2_bringup/my_nav2_launch.py，走 nav2_bringup 的 navigation_launch.py)
#   读取，而后者会无条件启动 smoother_server。直接删掉这段参数有让回滚路径
#   激活失败的风险。要清理的话，请连同两处启动文件里的 smoother_server 一起移除。
#
#   另外换成 MPPI 之后平滑的意义更小了：MPPI 直接优化出平滑的控制序列，
#   不再像 DWB 那样需要事后平滑全局路径。
smoother_server:
  ros__parameters:
    use_sim_time: False
    smoother_plugins: ["SimpleSmoother"]
    SimpleSmoother:
      plugin: "nav2_smoother::SimpleSmoother" # 基于数学曲线的简单平滑器
      tolerance: 1.0e-10              # 平滑迭代收敛容差
      max_its: 1000                   # 最大迭代次数
      do_refinement: True             # 是否在平滑后增加航点密度

# 恢复行为服务器配置
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw # 恢复行为所需的代价地图数据源
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait", "smart_recovery"] # 注册行为插件

    spin: # 原地旋转行为配置
      plugin: "me_nav2_bringup/StallAwareSpin"
      stall_timeout: 2.0
      progress_epsilon: 0.02            # 实际累计转动至少 0.02 rad 才刷新进展计时
    backup: # 倒车行为配置
      plugin: "me_nav2_bringup/StallAwareBackUp"
      stall_timeout: 2.0
      progress_epsilon: 0.01            # 实际累计移动至少 1 cm 才刷新进展计时
    drive_on_heading: # 沿当前朝向直行行为
      plugin: "nav2_behaviors/DriveOnHeading"
    wait: # 原地等待行为
      plugin: "nav2_behaviors/Wait"
    smart_recovery: # 直退优先；短缓弯；无平移通路才检查小角度原地旋转
      plugin: "me_nav2_bringup/SmartRecovery"
      enabled: true
      backup_distance: 0.5              # 单次动作总路程上限，含前进/倒车
      backup_speed: 0.1
      segment_length: 0.4              # 同时尝试 0.40 / 0.25 / 0.15 / 0.05 m
      execute_distance: 0.1            # 每走约 10 cm，重新检查并规划
      max_curvature: 1.5               # 1/m；平移中角速度不超过 0.15 rad/s
      max_segment_yaw: 0.52            # 单条候选最多约 30 度，不能横移
      collision_step: 0.005            # 与守卫一样，最远角点每 5 mm 采样
      # 与 recovery_guard.yaml 使用同一套扫描间隙规则。
      scan_topic: /scan
      scan_timeout: 0.5
      # Hexplorer 站立包络 863x470mm 的一半（与 costmap footprint 一致）
      half_length: 0.43
      half_width: 0.24
      min_clearance: 0.025
      min_linear: 0.02
      min_angular: 0.04
      lookahead_time: 0.5
      min_points: 2
      footprint_radius: 0.50           # 外接半径须 >= hypot(0.43, 0.24)=0.4924（SmartRecovery 安全校验）
      rotate_speed: 0.25
      max_total_rotation: 0.78          # 原地转向累计不超过约 45 度
      yaw_gain: 1.5
      cross_track_gain: 2.0
      max_cross_track: 0.06
      max_yaw_error: 0.26
      min_exit_distance: 0.30          # 2026-10-25 0.05→0.30：门中间挪 5cm 出不了 lethal 区，
                                       # 交还后立刻再失败再恢复，8 秒一轮在门里徘徊；
                                       # 现在要么走穿要么退出，不粘在门缝
      exit_cost: 180.0
      stall_timeout: 2.0               # 无实际进展就停，换候选；不延长总时限
      max_replans: 4
      # 自由空间脱困：全局代价图起点 >= trigger 时，搜索最近的正常可通行格
      # （cost <= target，即 <253），生成路径后仍用局部代价 + /scan 做硬校验。
      free_space_escape: true
      free_space_costmap_topic: /global_costmap/costmap_raw
      free_space_costmap_frame: map
      free_space_costmap_timeout: 1.0
      free_space_trigger_cost: 254.0   # 命中 254/255 才启动；253 仍走普通短动作
      free_space_target_cost: 252.0    # 目标 cost <=252，等价于 <253
      free_space_search_radius: 5.0
      free_space_max_distance: 2.5     # 单次动作最多走这么远
      free_space_lookahead: 0.35
      free_space_allow_blocked: true   # 允许穿 253/254，Dijkstra 高惩罚
      free_space_allow_unknown: false  # 255 默认不穿
      free_space_blocked_penalty: 20.0
      free_space_max_cells: 50000
      free_space_max_total_rotation: 3.14
      max_time_allowance: 40.0         # 覆盖 2.5m 路径 + 掉头

    # 行为的具体参数调整
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    # 设为 0：behavior_server 内部的代价地图碰撞预检会按 cycle_count=0 直接
    # 放行。标准 BackUp/Spin 由 recovery_guard 看实时 /scan 且区分
    # 运动方向；而这里的预检只看无方向的局部代价地图，车贴墙时会在发布速度
    # 之前就 "Collision Ahead" 中止，守卫根本没机会接手。
    # SmartRecovery 另外检查完整候选轨迹和执行中的修正速度，不受此值影响。
    simulate_ahead_time: 0.0
    max_rotational_vel: 0.6
    min_rotational_vel: 0.25
    rotational_acc_lim: 2.5

# 航点跟随器配置
waypoint_follower:
  ros__parameters:
    loop_rate: 20                     # 检查是否到达航点状态的频率
    stop_on_failure: false            # 如果前往某个航点失败，是否停止后续所有任务
    waypoint_task_executor_plugin: "wait_at_waypoint" # 到达航点后执行的任务
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      waypoint_pause_duration: 200    # 在每个航点暂停的毫秒数

# 速度平滑器配置
velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0         # 平滑计算频率
    scale_velocities: False           # 如果超出物理极限，是否等比例缩小XY速度以保持原本运动轨迹的弧度
    feedback: "OPEN_LOOP"             # "OPEN_LOOP" (使用最后发出的指令计算) 或 "CLOSED_LOOP" (通过odom话题读取底盘真实速度计算)
    max_velocity: [0.4, 0.0, 0.6]      # 与 controller_server 的 vx_max/wz_max 保持一致
    min_velocity: [-0.4, 0.0, -0.6]   # 各维度的最小速度
    max_accel: [1.5, 0.0, 2.0]        # 六足步态惯性大，加速度比轮式收窄
    max_decel: [-2.0, -0.0, -2.5]      # 各维度的最大减速度（负数）
    odom_topic: "odom"                # 仅在 CLOSED_LOOP 时使用
    odom_duration: 0.1                # 用于缓冲里程计数据的时长
